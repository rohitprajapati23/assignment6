<!DOCTYPE html>
<html>
<head>
    <title>Contact Page</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        input {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
        }

        #successMsg {
            color: green;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Contact Us</h2>

    <form id="contactForm">
        
        <label>Name:</label>
        <input type="text" name="username" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Phone:</label>
        <input type="text" name="phone" required>

        <button type="submit">Submit</button>

        <p id="successMsg">Form submitted successfully!</p>

    </form>
</div>

<script>
    const form = document.getElementById("contactForm");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        await fetch("/contact", {
            method: "POST",
            body: new URLSearchParams(formData)
        });

        
        successMsg.style.display = "block";

        
        form.reset();
    });
</script>

</body>
</html>
