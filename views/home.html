<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    

    <style>
      body {
    font-family: Arial;
    text-align: center;
    background-color: #f2f2f2;
}

h1 {
    color: blue;
}

.header{
    background-color: aliceblue;
    padding: 25px 200px;
}
.navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.logo{
    font-size: 1.5rem;
    font-weight: 600;
}
.username a{
    text-decoration: none;
    color: rgb(12, 181, 247);
    background-color: rgb(203, 230, 241);
    padding: 15px 20px;
    border-radius: 6px;
}
.username a:hover{
    cursor: pointer;
    background-color: rgb(177, 222, 240);
}
.nav ul{
    list-style: none;
}
.nav li a{
    text-decoration: none;
    color: rgb(78, 78, 78);
}
.nav li a:hover{
    border-bottom: 2px solid rgb(12, 181, 247);
}

.nav li{
    display: inline-block;
    font-size: 1.1rem;
    font-weight: 520;
    margin: 0 25px;
}




.hero-section{
    padding: 50px 200px;
}
.hero{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.left{
    margin-top: 100px;
}
.left h1{
    font-size: 3rem;
    font-weight: 700;
}
.left span{
    color: rgb(12, 181, 247);
}
.left p{
    font-size: 1.2rem;
    opacity: 0.7;
    margin-top: 20px;
}
.btn{
    margin-top: 30px;
    padding: 20px 40px;
    font-size: 1.1rem;
    background-color: rgb(12, 181, 247);
    color: white;
    border: none;
    border-radius: 15px;
}
.btn:hover{
    cursor: pointer;
    background-color: rgb(33, 191, 253);
}
.right{
    margin-top: 40px;
    margin-left: 30px;
}
.right img{
    height: 400px;
    width: auto;
}
    </style>

</head>

<body>
    <header class="header">
        <div class="navbar">
            <div class="logo">Logo</div>
            <div class="nav">
                <ul>
                    <li><a href="/">Home</a></li>
                    
                    <li><a href="/about">About Us</a></li>
                    <li><a href="/contact">Contact Us</a></li>
                </ul>
            </div>
            <div class="username">
                <a href="#">Username</a>
            </div>
        </div>
    </header>

    

    <section class="hero-section">
        <div class="hero">
            <div class="left">
                <h1>Revitalize Your<br>Clothes with Expert
                <br><span>Laundry Services</span></h1>
                <p>From premium dry cleaning to swift wash and fold,
                    we deliver care and convenience. Schedule a pickup
                    and rediscover the freshness of your clothes today!
                </p>
            
                <button onclick="nextSection()" class="btn">Book a service today!</button>
            </div>
            <div class="right">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/026/721/193/small/washing-machine-and-laundry-laundry-sticker-png.png" alt="Laundry Image">
            </div>
        </div>
    </section>
</body>
</html>
